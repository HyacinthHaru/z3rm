<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Z3rm server-canonical architecture</title><desc id="desc">GUI, CLI and SSH clients share one framed protocol to a mux server that owns sessions, layouts, terminal grids, scrollback, and PTYs.</desc>
