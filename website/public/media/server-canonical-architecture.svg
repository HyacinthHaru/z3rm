<g fill="#f3f5f7" font-size="18"><text x="494" y="252">sessions</text><text x="494" y="278" fill="#8e9aac" font-size="14">windows · panes</text><text x="704" y="252">layout tree</text><text x="704" y="278" fill="#8e9aac" font-size="14">focus · geometry</text><text x="914" y="252">terminal grids</text><text x="914" y="278" fill="#8e9aac" font-size="14">cursor · scrollback</text><text x="494" y="367">PTY processes</text><text x="494" y="395" fill="#8e9aac" font-size="14">input · resize · lifecycle</text><text x="809" y="367">shadow snapshots</text><text x="809" y="395" fill="#8e9aac" font-size="14">WAL · versions · restore</text></g>
