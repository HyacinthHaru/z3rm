syntax = "proto3";
package z3rm.mux;

// §3.10 / §9 协议版本：重大变更时升级 major，增量字段保持 forward-compatible。
// Protocol version — bumped on breaking changes.
// Minor additions use new field numbers (forward-compatible).
// Major version bumps require session restart.
message ProtocolVersion {
    uint32 major = 1;
    uint32 minor = 2;
}

// §9 消息总封包：每个 Envelope 都携带协议版本与三类 payload 之一。
// Every message envelope wraps a protocol version.
message Envelope {
    ProtocolVersion version = 1;
    oneof payload {
        Request request = 2;
        Response response = 3;
        Notification notification = 4;
    }
}

// === Session Lifecycle ===

// §3.10 会话元数据：会话 ID、名称、工作目录、创建时间、已连接客户端数。
message SessionInfo {
    string id = 1;
    string name = 2;
    string cwd = 3;
    uint64 created_timestamp = 4;
    uint32 attached_clients = 5;
}

// §3.10 创建会话请求。
message CreateSessionRequest {
    string name = 1;
    string cwd = 2;
}

// §3.10 列出所有会话。
message ListSessionsRequest {}

// §3.10 会话列表响应。
message ListSessionsResponse {
    repeated SessionInfo sessions = 1;
}

// §3.10 结束指定会话。
message KillSessionRequest {
    string id = 1;
}

// §3.3 在现有会话中创建新窗口 (Plan 32)
message NewWindowRequest {
    string session_id = 1;  // 目标会话 ID
}

// §3.3 新窗口创建响应
message NewWindowResponse {
    string window_id = 1;   // 新窗口 ID
    SessionSnapshot snapshot = 2;  // 会话快照
}

// §3.10 连接会话；AttachMode 定义共享/抢占/只读三种连接模式。
// §3.3 window_id 字段用于多窗口会话共享 (Plan 32)。
message AttachRequest {
    string session_id = 1;
    AttachMode mode = 2;
    // §3.3 窗口 ID (多窗口支持，Plan 32)
    string window_id = 3;
    // §3.3 客户端身份与角色 (Plan 33)
    ClientIdentity identity = 4;

    enum AttachMode {
        ATTACH_MODE_UNSPECIFIED = 0;
        SHARED = 1;
        STEAL = 2;
        READ_ONLY = 3;
    }
}

// §3.3 客户端身份: UUID + 角色 (Plan 33)
message ClientIdentity {
    string client_id = 1;  // 客户端 UUID
    ClientRole role = 2;   // 客户端角色
}

// §3.3 客户端角色 (Plan 33)
enum ClientRole {
    CLIENT_ROLE_UNSPECIFIED = 0;  // 未指定，默认为 READ_WRITE
    READ_ONLY = 1;                // 只读: 只能读取，不能写入
    READ_WRITE = 2;               // 读写: 可执行 pane 操作
    ADMIN = 3;                    // 管理员: 所有操作包括管理命令
}

// §3.10 连接成功后返回完整快照。
message AttachResponse {
    SessionSnapshot snapshot = 1;
}

// §3.10 会话权威快照：标签页、布局树、焦点信息。
message SessionSnapshot {
    repeated TabInfo tabs = 1;
    LayoutTree layout = 2;
    string focused_pane_id = 3;
    string focused_tab_id = 4;
    string session_id = 5;
}

// §3.10 标签页信息。
message TabInfo {
    string id = 1;
    string title = 2;
    repeated PaneInfo panes = 3;
}

// §3.3 / §3.10 Pane 元数据，包含网格生成计数器 generation。
message PaneInfo {
    string id = 1;
    string cwd = 2;
    string title = 3;
    string command = 4;
    uint64 generation = 5;  // current grid generation
    TerminalSize size = 6;
    bool is_alive = 7;
    bool zoomed = 8;  // §15.4 pane zoom state for snapshot restore
}

// §3.3 / §3.10 终端尺寸。
message TerminalSize {
    uint32 cols = 1;
    uint32 rows = 2;
}

// §3.10 断开连接请求。
message DetachRequest {}

// === Layout Tree ===

// §3.10 布局树顶层包装。
message LayoutTree {
    LayoutNode root = 1;
}

// §3.10 布局节点：Pane 叶子或 Split 容器。
message LayoutNode {
    string id = 1;
    oneof node {
        PaneLeaf pane = 2;
        SplitNode split = 3;
    }
}

// §3.10 叶子节点保存 pane_id。
message PaneLeaf {
    string pane_id = 1;
}

// §3.10 分割容器：方向 + 子节点 + 尺寸比例。
message SplitNode {
    SplitDirection direction = 1;
    repeated LayoutNode children = 2;
    repeated float ratios = 3;  // size ratios for each child

    enum SplitDirection {
        SPLIT_DIRECTION_UNSPECIFIED = 0;
        LEFT_RIGHT = 1;
        TOP_BOTTOM = 2;
    }
}

// === Pane Lifecycle ===

// §3.10 在会话/标签页中创建新 Pane。
message SpawnPaneRequest {
    string session_id = 1;
    string tab_id = 2;
    TerminalSize size = 3;
    optional ShellCommand command = 4;
    optional string cwd = 5;
    // §3.10 Replaying a spawn must not create a second pane. When set, the
    // server returns the pane the first request with this key produced.
    optional string idempotency_key = 6;
}

// §3.10 Shell 命令结构。
message ShellCommand {
    string program = 1;
    repeated string args = 2;
    map<string, string> env = 3;
}

// §3.10 拆分已有 Pane。
message SplitPaneRequest {
    string pane_id = 1;
    SplitNode.SplitDirection direction = 2;
    // Optional command to run in the new pane (inherits parent when unset).
    optional ShellCommand command = 3;
    // Optional working directory for the new pane (inherits parent when unset).
    optional string cwd = 4;
    // §3.10 See SpawnPaneRequest.idempotency_key.
    optional string idempotency_key = 5;
}

// §3.10 关闭 Pane。
message ClosePaneRequest {
    string pane_id = 1;
}

// §3.10 聚焦 Pane。
message FocusPaneRequest {
    string pane_id = 1;
}

// §3.10 重命名会话。
message RenameSessionRequest {
    string id = 1;
    string name = 2;
}

// §3.10 设置 Pane 标题。
message SetPaneTitleRequest {
    string pane_id = 1;
    string title = 2;
}

// §16.9 Adjust the server-authoritative layout ratio of a pane.
//
// The delta is relative, so replaying it moves the divider twice. A GUI
// dragging a divider reports where it landed instead: see SetLayoutRatios.
message ResizeLayoutRequest {
    string pane_id = 1;
    SplitNode.SplitDirection direction = 2;
    float delta = 3;  // ratio delta (e.g. 0.05 = 5%)
}

// §16.9 Set one split node's ratios outright.
//
// Absolute, so it is idempotent and expresses a mouse drag directly: the
// client reports the ratios it settled on rather than a sequence of nudges.
// The server normalises them, so any positive scale of the same proportions
// is the same request.
message SetLayoutRatiosRequest {
    string node_id = 1;
    repeated float ratios = 2;
}

// §16.9 Move a pane elsewhere in the layout tree.
//
// This is what a tab drag means to the server: the leaf leaves wherever it
// was and re-enters beside `target_pane_id`. Moving a pane to where it
// already sits is a no-op, so a redelivered drag does not shuffle the tree.
message MovePaneRequest {
    string pane_id = 1;
    string target_pane_id = 2;
    SplitNode.SplitDirection direction = 3;
    // Insert before the target rather than after it: dropping on the left
    // half of a pane and dropping on the right half are different requests.
    bool before = 4;
}

// §3.10 调整 Pane 尺寸。
message ResizePaneRequest {
    string pane_id = 1;
    uint32 cols = 2;
    uint32 rows = 3;
}

// === Input ===

// §3.10 向 Pane 发送原始输入字节。
message SendInputRequest {
    string pane_id = 1;
    bytes data = 2;
}

// §3.10 向 Pane 粘贴文本。
message PasteRequest {
    string pane_id = 1;
    string text = 2;
}

// === Grid Sync (generation counter, pull-based) ===

// §3.3 网格增量同步：客户端基于 generation 拉取自某个版本以来的变更。
message FetchGridUpdateRequest {
    string pane_id = 1;
    uint64 since_generation = 2;
}

// §3.3 网格更新响应：可能是增量 diff，也可能是完整快照。
message FetchGridUpdateResponse {
    uint64 from_generation = 1;
    uint64 to_generation = 2;
    oneof update {
        GridDiff diff = 3;
        FullGridSnapshot full_snapshot = 4;
    }
    // Highest PaneOutputChunk.output_sequence incorporated into this grid state.
    uint64 output_sequence = 5;
}

// §3.3 网格行级差异。
message GridDiff {
    repeated RowChange rows = 1;
}

// §3.3 单行变更。
message RowChange {
    uint32 row = 1;
    repeated Cell cells = 2;
}

// §3.3 单元格：字符、样式、前景/背景色。
message Cell {
    string char = 1;
    CellStyle style = 2;
    uint32 foreground = 3;  // 0xRRGGBB
    uint32 background = 4;  // 0xRRGGBB
    // Combining marks attached to the primary scalar in `char`.
    string zerowidth = 5;
    // OSC 8 metadata. Absent means the cell has no explicit hyperlink.
    Hyperlink hyperlink = 6;
}

message Hyperlink {
    string id = 1;
    string uri = 2;
}

// §3.3 单元格样式标志。
message CellStyle {
    bool bold = 1;
    bool italic = 2;
    // Retained for protocol 1.0 clients. New clients prefer underline_style.
    bool underline = 3;
    bool strikethrough = 4;
    bool dim = 5;
    bool reverse = 6;
    UnderlineStyle underline_style = 7;
    optional uint32 underline_color = 8;  // 0xRRGGBB
    bool wide_char = 9;
    bool wide_char_spacer = 10;
    bool leading_wide_char_spacer = 11;
    bool wrapline = 12;
    bool hidden = 13;

    enum UnderlineStyle {
        UNDERLINE_STYLE_UNSPECIFIED = 0;
        NONE = 1;
        SINGLE = 2;
        DOUBLE = 3;
        CURLY = 4;
        DOTTED = 5;
        DASHED = 6;
    }
}

// §3.3 完整网格快照，用于重连或缓存失效。
// §15.12 display_offset 携带服务端 alacritty grid 的 display_offset
// (滚动到历史缓冲的行数), 重连时客户端据此恢复滚动位置。
message FullGridSnapshot {
    uint32 cols = 1;
    uint32 rows = 2;
    repeated Cell cells = 3;  // flat row-major: cells[row * cols + col]
    CursorState cursor = 4;
    bool alternate_screen = 5;
    // §15.12 服务端 grid display_offset (0 = 滚动到底部/最新行)。
    uint32 display_offset = 6;
    optional uint32 modes = 7;
    // Number of authoritative history rows available through FetchScrollback.
    uint32 history_size = 8;
    // Changes only when authoritative scrollback contents or layout change.
    uint64 history_version = 9;
}

// §3.3 光标状态。
message CursorState {
    uint32 col = 1;
    uint32 row = 2;
    CursorStyle style = 3;
    bool visible = 4;
    bool blinking = 5;

    enum CursorStyle {
        CURSOR_STYLE_UNSPECIFIED = 0;
        BLOCK = 1;
        BAR = 2;
        UNDERLINE = 3;
        HOLLOW_BLOCK = 4;
        HIDDEN = 5;
    }
}

// §3.1 PTY 输出字节流 (in-place render-path exception): server → client 原始 PTY bytes.
message PaneOutputChunk {
    string pane_id = 1;
    bytes data = 2;
    // Monotonic per-pane sequence. Gaps require an authoritative grid resync.
    uint64 output_sequence = 3;
}

// §3.1 订阅 pane PTY 输出字节流 (in-place render-path).
message SubscribePaneOutputRequest {
    string pane_id = 1;
}

// §3.1 订阅响应 (确认订阅成功).
message SubscribePaneOutputResponse {}

// === Scrollback ===

// §3.10 拉取历史滚动缓冲区。
message FetchScrollbackRequest {
    string pane_id = 1;
    uint32 from_line = 2;
    uint32 direction = 3;  // 0 = up, 1 = down
    uint32 count = 4;
}

// §3.10 历史滚动缓冲响应。
message FetchScrollbackResponse {
    repeated RowChange lines = 1;
    uint32 total_lines = 2;
    uint64 scrollback_version = 3;  // counter + timestamp for cache invalidation
}

// §16.9 搜索回滚缓冲区。
message SearchScrollbackRequest {
    string pane_id = 1;
    string regex = 2;         // 正则表达式
    uint32 from_line = 3;     // 起始行号
    uint32 direction = 4;     // 0 = up, 1 = down
    uint32 max_results = 5;   // 最大结果数
}

// §16.9 搜索结果: 匹配行号 + 上下文片段。
message SearchScrollbackResponse {
    repeated SearchMatch matches = 1;
    uint64 scrollback_version = 2;
}

// §16.9 单个搜索结果。
message SearchMatch {
    uint32 line_number = 1;   // 匹配行号
    repeated Cell context = 2; // 上下文单元格
}

// §16.9 会话级同步滚动通知 (server → client)。
message SyncScrollbackNotification {
    string pane_id = 1;
    uint32 scroll_offset = 2;
}

// === Shell commands (OSC 133, §3.3) ===

// §3.10 列出 pane 里由 OSC 133 marker 划出的命令。
message ListCommandsRequest {
    string pane_id = 1;
    // 只返回最近的 N 条; 0 = 全部仍被保留的。
    uint32 max_results = 2;
}

// §3.3 一条命令的某一个 OSC 133 marker。
//
// 消息本身存在 = shell 发过这个 marker。行号是另一回事: 记下来的那一行可能
// 已经被逐出 scrollback, 或者行号在一次 reflow / reset / 满容量回卷之后作废,
// 这时 `line` 缺省。绝不在这种情况下猜一个行号 —— 错的行号比查不到糟得多。
message CommandMarker {
    optional int64 line = 1;  // tmux 行号: 0 = 可见区首行, 负数进历史
    uint32 column = 2;        // marker 落下时光标所在列
}

// §3.10 一条 shell 命令: 四个 OSC 133 marker + 退出码。
//
// 真实 shell 不保证四个都发 (有的只发 A 和 D), 命令还在跑时也不会有 D, 所以
// 每个 marker 都是可缺省的。退出码与行号相互独立: 行号不可用不影响退出码。
message CommandRange {
    // 稳定标识: 本命令第一个 marker 的 sequence。pane 生命周期内单调递增,
    // 但不是"第几条命令" —— 被丢弃的旧 marker 无法回溯出命令计数。
    uint64 id = 1;
    CommandMarker prompt = 2;        // A: 提示符开始
    CommandMarker command = 3;       // B: 命令行开始
    CommandMarker output_start = 4;  // C: 输出开始
    CommandMarker command_end = 5;   // D: 命令结束; 缺省 = 还在跑
    optional int32 exit_code = 6;    // 只有 `OSC 133 ; D ; <status>` 才有
}

// §3.10 命令列表响应。
message ListCommandsResponse {
    repeated CommandRange commands = 1;
    // 行号是相对这个 scrollback 大小换算出来的。
    uint32 history_size = 2;
    // 当前保留的 marker 总数。commands 为空而它不为 0, 说明 shell 只发了
    // prompt start, 没有报告任何命令边界。
    uint32 recorded_markers = 3;
}

// === File Fetch (for remote file viewer) ===

// §3.10 读取远程/本地文件。
message ReadFileRequest {
    string path = 1;
    optional uint32 offset_line = 2;
    optional uint32 max_lines = 3;
    // Byte pagination is used for binary files and for streaming the CLI.
    // It is mutually exclusive with offset_line/max_lines.
    optional uint64 offset_bytes = 4;
    optional uint32 max_bytes = 5;
}

// §3.10 文件内容响应。
message ReadFileResponse {
    bytes content = 1;
    bool is_binary = 2;
    string encoding = 3;  // "utf-8", "binary", etc.
    uint32 offset_line = 4;
    optional uint32 next_offset_line = 5;
    uint32 total_lines = 6;
    uint64 offset_bytes = 7;
    optional uint64 next_offset_bytes = 8;
    uint64 total_bytes = 9;
}

// §3.10 列出目录。
message ListDirRequest {
    string path = 1;
}

// §3.10 目录条目。
message DirEntry {
    string name = 1;
    bool is_dir = 2;
    uint64 size = 3;
    bool is_modified = 4;  // shadow snapshot detected change
}

// §3.10 列出目录响应。
message ListDirResponse {
    repeated DirEntry entries = 1;
}

// §3.10 文件 stat。
message StatFileRequest {
    string path = 1;
}

// §3.10 文件 stat 响应。
message StatFileResponse {
    bool exists = 1;
    uint64 size = 2;
    bool is_dir = 3;
    uint64 modified_timestamp = 4;
}

// === Shadow File Versions (crash-safe filesystem versioning, §4) ===

// §4.4 单个文件版本：版本 ID、单调递增的 SeqNo 与触发原因。
message FileVersion {
    uint64 version_id = 1;  // §4.5 稳定版本 ID
    uint64 seq_no = 2;      // §4.4 单调递增序列号（绝不用 wall clock / mtime 排序）
    string trigger = 3;     // 触发此版本的稳定字符串标识（例如 "edit"、"decline-undo"）
}

// §4 列出某会话内某路径的全部版本。
message ListFileVersionsRequest {
    string session_id = 1;
    string path = 2;        // UTF-8 文件路径
}

// §4 版本列表响应。
message ListFileVersionsResponse {
    repeated FileVersion versions = 1;
}

// §4 获取指定版本的字节内容。
message GetFileVersionRequest {
    string session_id = 1;
    string path = 2;        // UTF-8 文件路径
    uint64 version_id = 3;  // §4.5 目标版本 ID
}

// §4 版本内容响应。
message GetFileVersionResponse {
    bytes content = 1;
}

// §4.8 撤销此后的改动：把文件的内容还原成 version_id 那一版。
// 还原本身也会记为一个新版本（trigger=decline），历史不会被抹掉。
message DeclineFileVersionRequest {
    string session_id = 1;
    string path = 2;        // UTF-8 文件路径
    uint64 version_id = 3;  // §4.5 要还原到的版本 ID（不是要丢弃的那一版）
}

// §4.8 拒绝版本响应：restored 表示是否成功回滚。
message DeclineFileVersionResponse {
    bool restored = 1;
}

// §4 某个文件在本 session 内累计的影子版本概况。
message ChangedFile {
    string path = 1;           // 绝对路径
    uint64 version_count = 2;  // 该文件的版本数量
    uint64 latest_seq_no = 3;  // §4.4 最新版本的单调序列号
}

// §4 列出本 session 内所有留有影子版本的文件。
message ListChangedFilesRequest {
    string session_id = 1;
}

// §4 变更文件列表响应，按 latest_seq_no 从新到旧排列。
message ListChangedFilesResponse {
    repeated ChangedFile files = 1;
}

// === Clipboard (server relay hub) ===

// §16 剪贴板条目：内容类型 + 数据 + 来源主机。
message ClipboardEntry {
    ClipboardContentType content_type = 1;
    bytes data = 2;
    string origin_host = 3;  // which machine this came from

    enum ClipboardContentType {
        CONTENT_TYPE_UNSPECIFIED = 0;
        TEXT = 1;
        IMAGE_PNG = 2;
        FILE_PATH = 3;
    }
}

// §16 设置剪贴板。
message SetClipboardRequest {
    ClipboardEntry entry = 1;
}

// §16 获取剪贴板。
message GetClipboardRequest {}

// §16 获取剪贴板响应。
message GetClipboardResponse {
    ClipboardEntry entry = 1;
}

// === Extension Chrome RPC ===

// §16 扩展 Chrome 视图更新：服务端向客户端推送 VDOM 字节。
message ExtensionChromeUpdate {
    string extension_id = 1;
    string view_id = 2;
    bytes vdom_payload = 3;  // serialized VDOM JSON
}

// §16.6 远程扩展安装请求（Plan 19）。
message InstallExtensionRequest {
    string name = 1;
    bytes manifest = 2;   // extension.json bytes
    bytes source = 3;     // tar.gz of extension directory
}

// §16.6 远程扩展安装响应。
message InstallExtensionResponse {
    string name = 1;
    bool success = 2;
    string error = 3;
}

// §16.9 服务端扩展 chrome 交互：客户端把服务端渲染视图上的 onClick/onChange
// 描述符回传给权威服务端宿主执行，而不是在客户端运行时执行。
//
// 客户端只允许转发它确实收到过的 (extension_id, view_id) —— 即
// ExtensionChromeUpdate 键控的视图；服务端校验扩展已加载、未挂起且该视图
// 已发布 (published_views) 后才派发，否则 fail closed 并返回上下文错误。
message ExtensionChromeActionRequest {
    string extension_id = 1;
    string view_id = 2;
    string command = 3;
    string arguments = 4;  // JSON 数组，转发给扩展注册的命令
}

// §16.9 服务端扩展 chrome 交互响应。
message ExtensionChromeActionResponse {
    bool accepted = 1;
    string error = 2;
}

// === Notifications (server → client push) ===

// §9 / §16 服务端主动推送通知。
message Notification {
    oneof event {
        PaneDirty pane_dirty = 1;
        PaneAdded pane_added = 2;
        PaneRemoved pane_removed = 3;
        PaneFocused pane_focused = 4;
        TabTitleChanged tab_title_changed = 5;
        SessionLayoutChanged session_layout_changed = 6;
        ClipboardChanged clipboard_changed = 7;
        ExtensionChromeUpdate extension_chrome = 8;
        SyncScrollbackNotification sync_scrollback = 9;
        WindowAdded window_added = 10;
        WindowRemoved window_removed = 11;
        ShellIntegrationChanged shell_integration_changed = 12;
        PaneZoomed pane_zoomed = 13;
        PaneOutputChunk pane_output = 14;
        PaneTitleChanged pane_title_changed = 15;
        PaneBell pane_bell = 16;
        PaneMedia pane_media = 17;
        PaneAction pane_action = 18;
    }
}

// §9 Pane 内容变脏通知。
message PaneDirty {
    string pane_id = 1;
}

// §9 Pane 新增通知。
message PaneAdded {
    string pane_id = 1;
    string tab_id = 2;
}

// §9 Pane 移除通知（可带退出码）。
message PaneRemoved {
    string pane_id = 1;
    int32 exit_code = 2;
}

// §9 Pane 获得焦点通知。
message PaneFocused {
    string pane_id = 1;
}

// §9 标签页标题变更通知。
message TabTitleChanged {
    string tab_id = 1;
    string title = 2;
}

// §9 会话布局变更通知。
// §15.4 可选完整权威快照: 仅客户端 in-place 重连后的合成广播携带,
// 用于区分「重连全量对账」与普通布局 delta。普通服务端布局通知保持
// snapshot 缺省 (None), 向前兼容 (field 2 为增量新增)。
message SessionLayoutChanged {
    LayoutTree layout = 1;
    SessionSnapshot snapshot = 2;
}

// §16 剪贴板变更通知。
message ClipboardChanged {}

// §3.3 新窗口加入会话通知 (Plan 32)
message WindowAdded {
    string window_id = 1;
    string session_id = 2;
}

// §3.3 窗口离开会话通知 (Plan 32)
message WindowRemoved {
    string window_id = 1;
    string session_id = 2;
}

// §3.3 Shell integration 变更通知 (OSC 7/133)
message ShellIntegrationChanged {
    string cwd = 1;
}

// §3.3 Pane zoom 状态变更通知
message PaneZoomed {
    string pane_id = 1;
    bool zoomed = 2;
}
// §9 / §3.4 Pane 标题变更通知 (OSC 0/1/2 或 SetPaneTitle 触发)。
message PaneTitleChanged {
    string pane_id = 1;
    string title = 2;
}
// §9 / §15.13 Pane 终端铃声通知 (终端 BEL 字符, §15.13 BSU timeout 100ms)。
message PaneBell {
    string pane_id = 1;
}

// §9 / §3.3 Pane 多媒体通知：用于承载 v86 之类 guest 终端从 canvas / framebuffer
// 发出的二进制媒体片段 (通常是 PNG 截图)。v86 runtime 通过
// screen_make_screenshot / screen_write_image 把 framebuffer 切成多块, 每块
// 一条 PaneMedia: 同一帧的所有块共享 image_id 与 sequence (全局单调序号,
// 用于客户端排序与去重), format 是帧格式标签 (如 "image/png"), row/column
// 是当前块在整帧中的起始位置, columns/rows 是整帧尺寸, final_chunk 标记
// 整帧的最后一块, delete 表示撤销/清除之前发布的 image_id。客户端不解析
// data 内容, 它把数据透传给本地渲染器。
message PaneMedia {
    string pane_id = 1;
    uint64 sequence = 2;
    uint32 image_id = 3;
    uint32 format = 4;
    int32 row = 5;
    uint32 column = 6;
    uint32 columns = 7;
    uint32 rows = 8;
    bytes data = 9;
    bool final_chunk = 10;
    bool delete = 11;
}

// §9 / §3.3 Pane 动作通知：承载 guest 终端的结构化动作。kind 是稳定类型
// 标签 (DOWNLOAD 下载动作 / COPY 复制动作), value 是动作负载字符串
// (例如下载 URL 或要复制的文本)。sequence 与 PaneMedia 共用同一个单调
// 序号空间, 用于客户端按序消费。
message PaneAction {
    string pane_id = 1;
    uint64 sequence = 2;
    PaneActionKind kind = 3;
    string value = 4;
}

// §9 / §3.3 Pane 动作类型。
enum PaneActionKind {
    PANE_ACTION_KIND_UNSPECIFIED = 0;
    DOWNLOAD = 1;
    COPY = 2;
}


// === Pane Zoom ===

// §3.3 Pane zoom 请求。
message ZoomPaneRequest {
    string pane_id = 1;
    bool zoom = 2;
}

// §3.3 Pane zoom 响应。
message ZoomPaneResponse {}

// === Shell Integration (OSC 7/133) ===

// §3.3 查询 pane 的 shell integration 状态。
message ShellIntegrationRequest {
    string pane_id = 1;
}

// §3.3 Shell integration 状态响应。
message ShellIntegrationResponse {
    string cwd = 1;
    uint32 prompt_marker = 2;
}

// §3.5 Explicit process shutdown (admin-only). Empty body; server flushes
// the response then exits the accept loop.
message ShutdownRequest {}

// §3.6 恢复候选列表：daemon 启动时从持久化元数据扫描出的可恢复会话。
// 这些候选不在 live registry 中，必须经 ConfirmRecovery 显式确认后才重建 shells。
message ListRecoveryCandidatesRequest {}

message RecoveryCandidateInfo {
    string id = 1;
    string name = 2;
    string cwd = 3;
    // 是否携带完整 tab/pane 元数据；legacy 行无元数据，确认前不可重建。
    bool metadata_complete = 4;
    repeated string pane_ids = 5;
}

message ListRecoveryCandidatesResponse {
    repeated RecoveryCandidateInfo candidates = 1;
    // 扫描阶段被拒的持久化行，每条一句原因。这些会话不可恢复，但用户需要知道
    // 它们存在：只写服务端日志的话，界面上等同于"没有这个会话"。
    repeated string rejected = 2;
}

// §3.6 确认恢复指定会话：为每个持久化 pane 启动 fresh default shell
// （绝不重跑 prior_command），重建 tab/layout/focus 并注册到 live registry。
message ConfirmRecoveryRequest {
    string session_id = 1;
}

message ConfirmRecoveryResponse {
    string session_id = 1;
    repeated string pane_ids = 2;
}

// === Request/Response envelope ===

// §9 请求信封：携带 request_id 与具体请求体。
message Request {
    uint64 request_id = 1;
    oneof body {
        CreateSessionRequest create_session = 2;
        ListSessionsRequest list_sessions = 3;
        KillSessionRequest kill_session = 4;
        AttachRequest attach = 5;
        DetachRequest detach = 6;
        SpawnPaneRequest spawn_pane = 7;
        SplitPaneRequest split_pane = 8;
        ClosePaneRequest close_pane = 9;
        FocusPaneRequest focus_pane = 10;
        ResizePaneRequest resize_pane = 11;
        SendInputRequest send_input = 12;
        PasteRequest paste = 13;
        FetchGridUpdateRequest fetch_grid_update = 14;
        FetchScrollbackRequest fetch_scrollback = 15;
        ReadFileRequest read_file = 16;
        ListDirRequest list_dir = 17;
        StatFileRequest stat_file = 18;
        SetClipboardRequest set_clipboard = 19;
        GetClipboardRequest get_clipboard = 20;
        RenameSessionRequest rename_session = 21;
        SetPaneTitleRequest set_pane_title = 22;
        InstallExtensionRequest install_extension = 23;
        SearchScrollbackRequest search_scrollback = 24;
        NewWindowRequest new_window = 25;
        ZoomPaneRequest zoom_pane = 26;
        ShellIntegrationRequest shell_integration = 27;
        SubscribePaneOutputRequest subscribe_pane_output = 28;
        ShutdownRequest shutdown = 29;
        ListFileVersionsRequest list_file_versions = 30;  // §4 shadow snapshot
        GetFileVersionRequest get_file_version = 31;       // §4 shadow snapshot
        DeclineFileVersionRequest decline_file_version = 32;  // §4 shadow snapshot
        ResizeLayoutRequest resize_layout = 33;  // §16.9 server-owned layout ratios
        ListRecoveryCandidatesRequest list_recovery_candidates = 34;  // §3.6 recovery
        ConfirmRecoveryRequest confirm_recovery = 35;  // §3.6 recovery
        ListChangedFilesRequest list_changed_files = 36;  // §4 shadow snapshot
        ListCommandsRequest list_commands = 37;  // §3.3 OSC 133 shell commands
        ExtensionChromeActionRequest extension_chrome_action = 38;  // §16.9
        SetLayoutRatiosRequest set_layout_ratios = 39;  // §16.9 absolute ratios
        MovePaneRequest move_pane = 40;  // §16.9 tab drag
    }
}

// §9 响应信封：携带 request_id、错误字符串或具体响应体。
message Response {
    uint64 request_id = 1;
    oneof body {
        string error = 2;  // non-empty = error
        SessionInfo session = 3;
        ListSessionsResponse sessions = 4;
        AttachResponse attach = 5;
        string pane_id = 6;
        FetchGridUpdateResponse grid_update = 7;
        FetchScrollbackResponse scrollback = 8;
        ReadFileResponse file_content = 9;
        ListDirResponse dir_listing = 10;
        StatFileResponse file_stat = 11;
        GetClipboardResponse clipboard = 12;
        InstallExtensionResponse extension_installed = 13;
        SearchScrollbackResponse search_scrollback = 14;
        NewWindowResponse new_window = 15;
        ZoomPaneResponse zoom_pane = 16;
        ShellIntegrationResponse shell_integration = 17;
        SubscribePaneOutputResponse subscribe_pane_output = 18;
        ListFileVersionsResponse file_versions = 19;          // §4 shadow snapshot
        GetFileVersionResponse file_version_content = 20;     // §4 shadow snapshot
        DeclineFileVersionResponse decline_file_version = 21; // §4 shadow snapshot
        ListRecoveryCandidatesResponse recovery_candidates = 22;  // §3.6 recovery
        ConfirmRecoveryResponse recovery_confirmed = 23;  // §3.6 recovery
        ListChangedFilesResponse changed_files = 24;  // §4 shadow snapshot
        ListCommandsResponse commands = 25;  // §3.3 OSC 133 shell commands
        ExtensionChromeActionResponse extension_chrome_action_result = 26;  // §16.9
    }
}
