[package]
name = "mux_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
path = "src/mux_server.rs"

[[bin]]
name = "z3rm-server"
path = "src/main.rs"

[features]
# The in-guest build (i686-unknown-linux-musl, run inside the v86 Linux
# image): no QuickJS host, no TLS client, no SQLite persistence, no shadow
# snapshots — those need C toolchains or host services the guest lacks.
# `cargo build --no-default-features --features guest --target i686-unknown-linux-musl`
guest = []
default = ["desktop"]
desktop = [
    "dep:mux",
    "dep:quickjs_runtime",
    "dep:reqwest_client",
    "dep:sqlez",
    "dep:shadow_snapshot",
    "dep:sysinfo",
    "dep:walkdir",
    "dep:http_client",
]

[dependencies]
web-time.workspace = true
mux = { workspace = true, optional = true }
mux_protocol = { workspace = true }
alacritty_terminal = { workspace = true }
prost = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
paths = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
tracing = { workspace = true }
zlog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
nanoid = "0.4"
base64 = "0.22"
regex = { workspace = true }

# Desktop-only subsystems, each needing a C toolchain or host services the
# guest and browser lack. The browser build compiles them today (they target
# wasm32 fine); the guest build excludes them via --no-default-features.
quickjs_runtime = { workspace = true, optional = true }
reqwest_client = { workspace = true, optional = true }
sqlez = { workspace = true, optional = true }
shadow_snapshot = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }

# Pure-Rust crates the native server needs; the browser has no PTYs or
# sockets so they are native-only, but both the desktop and the guest
# (i686-musl) compile them.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
portable-pty = { workspace = true }
interprocess = { version = "2", features = ["tokio"] }
tokio = { workspace = true, features = ["full"] }
tar = "0.4"
dirs = "6.0"
libc = { workspace = true }
tempfile = { workspace = true }

# smol (via psm's stack-switching asm) needs a C compiler; only the desktop
# extension host uses it.
[target.'cfg(all(not(target_family = "wasm"), not(feature = "guest")))'.dependencies]
smol = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
