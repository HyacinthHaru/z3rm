name: Deploy Z3rm website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy_website.yml"
      - "docs/implementation-status/**"
      - "website/**"
      - "crates/gpui/**"
      - "crates/gpui_web/**"
      - "crates/gpui_wgpu/**"
      - "crates/mux_protocol/**"
      - "crates/z3rm_web/**"
      - "crates/settings/**"
      - "crates/terminal_view/**"
      - "crates/title_bar/**"
      - "crates/command_palette/**"
      - "crates/editor/**"
      - "crates/mux/**"
      - "crates/mux_server/**"
      - "crates/z3rm_guest_tui/**"
      - "crates/db/**"
      - "crates/session/**"
      - "crates/theme/**"
      - "crates/ui/**"
      - "crates/language/**"
      - "crates/assets/**"
      - "crates/release_channel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/workspace/src/layout_projection.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 10.32.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install WebAssembly and guest build tools
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown i686-unknown-linux-musl
          curl --fail --location --output /tmp/trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  /tmp/trunk.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/trunk.tar.gz --directory /tmp
          sudo install /tmp/trunk /usr/local/bin/trunk
      - name: Verify vendored v86 runtime
        run: sha256sum --check SHA256SUMS.txt
        working-directory: website/public/v86
      - name: Build GPUI WebAssembly demo
        run: pnpm build:wasm
        working-directory: website
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: website
      - name: Check content and types
        run: pnpm check
        working-directory: website
      - name: Build static site
        run: pnpm build
        working-directory: website
      - name: Serve built site
        run: |
          nohup pnpm exec astro preview --host 127.0.0.1 --port 4331 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4331/z3rm/en/ > /dev/null && break
            sleep 2
          done
          curl -f http://127.0.0.1:4331/z3rm/en/ > /dev/null
        working-directory: website
      - name: Run browser verification
        run: pnpm exec playwright test --project chromium
        working-directory: website
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4331/z3rm/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: website/dist

  deploy:
    name: Deploy
    # Only this job publishes, so only this job needs to. Granting it at the
    # top of the file hands the write to `build` too, which runs the site's
    # own build scripts.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
