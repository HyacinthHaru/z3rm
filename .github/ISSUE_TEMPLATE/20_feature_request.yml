name: Feature request
description: Propose a new feature or enhancement for z3rm.
type: Feature
labels: enhancement
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem does this feature solve? What behavior is missing or awkward today?
      placeholder: |
        Example: remote windows do not expose their connection state, so a dead SSH tunnel is invisible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: How should z3rm behave once this lands? Include acceptance criteria when practical.
      placeholder: |
        - Every window bound to a mux session shows a persistent connection indicator.
        - mux::Reconnect restores the tunnel for the window it was invoked on.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Affected area
      description: Optional. Name the subsystem this touches (mux, terminal, snapshot, extensions, UI, ...).
    validations:
      required: false
