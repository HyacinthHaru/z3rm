<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Persistent Z3rm session lifecycle</title><desc id="desc">A session is created, detached without stopping, reattached locally or remotely, and explicitly killed.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7f8b9d"/></marker></defs><rect width="1200" height="430" rx="18" fill="#0d1117"/><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><text x="58" y="58" fill="#8e9aac" font-size="15" letter-spacing="2">YOUR SHELLS OUTLIVE THE WINDOW</text><path d="M192 216H375M508 216H691M824 216H1006" stroke="#7f8b9d" stroke-width="2" marker-end="url(#a)"/><g stroke-width="2"><circle cx="128" cy="216" r="64" fill="#13243a" stroke="#2a78d4"/><circle cx="442" cy="216" r="66" fill="#17202f" stroke="#7f8b9d"/><circle cx="758" cy="216" r="66" fill="#13243a" stroke="#2a78d4"/><circle cx="1072" cy="216" r="64" fill="#24191b" stroke="#ef6a65"/></g><g fill="#f3f5f7" text-anchor="middle"><text x="128" y="210" font-size="20">CREATE</text><text x="128" y="238" fill="#8e9aac" font-size="13">new session</text><text x="442" y="210" font-size="20">DETACH</text><text x="442" y="238" fill="#8e9aac" font-size="13">server keeps running</text><text x="758" y="210" font-size="20">ATTACH</text><text x="758" y="238" fill="#8e9aac" font-size="13">local or SSH</text><text x="1072" y="210" font-size="20">KILL</text><text x="1072" y="238" fill="#ef9a96" font-size="13">explicit only</text></g><path d="M745 146C712 70 485 70 452 143" fill="none" stroke="#2a78d4" stroke-width="2" marker-end="url(#a)"/><text x="598" y="87" fill="#62a6ff" text-anchor="middle" font-size="14">reconnect anywhere</text><g fill="#8e9aac" font-size="14"><text x="58" y="370">$ z3rm new -s work</text><text x="366" y="370">Ctrl-b d</text><text x="664" y="370">$ z3rm attach -t work</text><text x="957" y="370">$ z3rm kill -t work</text></g></g></svg>