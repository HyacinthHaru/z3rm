[package]
name = "lsp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/lsp.rs"
doctest = false

[features]
test-support = ["async-pipe", "gpui_util"]

[dependencies]
web-time.workspace = true
anyhow.workspace = true
async-pipe = { workspace = true, optional = true }
collections.workspace = true
gpui_util = { workspace = true, optional = true }
futures.workspace = true
gpui.workspace = true
log.workspace = true
lsp-types.workspace = true
parking_lot.workspace = true
postage.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
util.workspace = true
release_channel.workspace = true

async-channel.workspace = true
futures-lite.workspace = true

# smol drags in async-io -> polling/rustix, which do not build for
# wasm32-unknown-unknown. The browser never spawns a language server anyway.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true

[dev-dependencies]
async-pipe.workspace = true
gpui_util.workspace = true
ctor.workspace = true
gpui = { workspace = true, features = ["test-support"] }
semver.workspace = true
util = { workspace = true, features = ["test-support"] }
zlog.workspace = true
