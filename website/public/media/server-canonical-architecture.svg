<g fill="#151b24" stroke="#364152"><rect x="56" y="108" width="210" height="86" rx="8"/><rect x="56" y="236" width="210" height="86" rx="8"/><rect x="56" y="364" width="210" height="86" rx="8"/></g>
<g fill="#f3f5f7" font-size="23"><text x="86" y="160">GUI / GPUI</text><text x="86" y="288">CLI / Agent</text><text x="86" y="416">SSH / Remote</text></g>
